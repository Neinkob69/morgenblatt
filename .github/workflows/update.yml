name: Tägliche Zeitung generieren

# Baut die Ausgabe und veröffentlicht sie direkt auf GitHub Pages – ohne tägliche Commits.
# Einmalig nötig: Settings → Pages → Source: „GitHub Actions“.

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC = 07:00 (Winter) bzw. 08:00 (Sommer) in Wien
  workflow_dispatch:      # Manueller Start-Button
    inputs:
      nur_frontend:
        description: 'Nur die Oberfläche neu veröffentlichen (keine neue Ausgabe)'
        type: boolean
        default: false
  push:                   # Änderungen sofort live stellen
    branches: [main]
    paths: ['index.html', 'sw.js', 'manifest.webmanifest', 'icons/**', 'feeds.json', 'update_newspaper.py', 'requirements.txt']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Auschecken des Repositories
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # damit sich vergleichen lässt, was ein Push geändert hat

      # Push nur an der Oberfläche → Ausgabe bleibt; neue Feeds oder Pipeline → neue Ausgabe
      - name: Was hat der Push geändert?
        id: changes
        if: github.event_name == 'push'
        run: |
          files=$(git diff --name-only "${{ github.event.before }}" HEAD 2>/dev/null) || files="unbekannt"
          echo "$files"
          if echo "$files" | grep -qE '^(feeds\.json|update_newspaper\.py|requirements\.txt|unbekannt)$'; then
            echo "nur_frontend=false" >> "$GITHUB_OUTPUT"
          else
            echo "nur_frontend=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Pages vorbereiten
        id: pages
        uses: actions/configure-pages@v5

      - name: Zeitungskurator ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MORGENBLATT_PASSWORT: ${{ secrets.MORGENBLATT_PASSWORT }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          OUT_DIR: _site
          NUR_FRONTEND: ${{ steps.changes.outputs.nur_frontend == 'true' || inputs.nur_frontend }}
        run: |
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest icons _site/
          python update_newspaper.py

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
