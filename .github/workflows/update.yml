name: Tägliche Zeitung generieren

on:
  schedule:
    - cron: '0 6 * * *'  # Jeden Tag um 06:00 Uhr
  workflow_dispatch:      # Manueller Start-Button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Auschecken des Repositories
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: pip install feedparser google-genai

      - name: Zeitungskurator ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_newspaper.py

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Automatische Ausgabe aktualisiert" && git push)
