name: Tägliche Zeitung generieren

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC = 07:00 (Winter) bzw. 08:00 (Sommer) in Wien
  workflow_dispatch:      # Manueller Start-Button

permissions:
  contents: write

concurrency:
  group: zeitung
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Auschecken des Repositories
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Zeitungskurator ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_newspaper.py

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add edition.json feeds.opml
          git diff --staged --quiet || (git commit -m "Automatische Ausgabe aktualisiert" && git push)
