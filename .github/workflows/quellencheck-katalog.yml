# Temporär: prüft Quellen für einen Themenkatalog aus dem GitHub-Netz (wird wieder entfernt)
name: Quellencheck Katalog
on:
  push:
    branches: [claude/happy-keller-0lwfnt]
    paths: ['.github/workflows/quellencheck-katalog.yml', 'quellencheck_katalog.py']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python quellencheck_katalog.py
